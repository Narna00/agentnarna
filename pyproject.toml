[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnarna"
version = "0.1.0"
description = "Evidence-first agentic security research for authorized pentests and bug bounties."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AgentNarna contributors" }]
keywords = ["security", "bug-bounty", "recon", "pentest", "ai-agent", "vulnerability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.32.3",
    "mcp>=1.28",
]

[project.optional-dependencies]
test = ["pytest>=8.3.2"]

[project.urls]
Upstream = "https://github.com/awarexone/Agentic-Bug-Hunter"

[project.scripts]
agentnarna = "bughunter.__main__:main"
agentnarna-agent = "bughunter.__main__:agent_main"
# Compatibility aliases for existing installations and scripts.
bughunter = "bughunter.__main__:main"
bughunter-agent = "bughunter.__main__:agent_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bughunter*"]

[tool.setuptools.package-data]
bughunter = ["**/*"]
